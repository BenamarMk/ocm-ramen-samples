---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-0-and-1
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: quay.io/nirsof/busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" | tee -a /var/log/ramen.log /var/log2/ramen.log
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 1 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlog2
              mountPath: /var/log2
      volumes:
        - name: varlog
          persistentVolumeClaim:
            claimName: busybox-pvc-0
        - name: varlog2
          persistentVolumeClaim:
            claimName:  busybox-pvc-1
